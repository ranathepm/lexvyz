packages:
  - "."
# pnpm 11 default is 1440 (1 day cooldown for new packages). The v0 lockfile
# pins update-browserslist-db@1.3.1, published <24h ago; disable the cooldown
# so `pnpm install` passes for this trusted template project.
minimumReleaseAge: 0
# pnpm 11 blocks postinstall scripts by default (replaced onlyBuiltDependencies
# with an allowBuilds map); sharp needs its build script for next/image.
allowBuilds:
  sharp: true
  unrs-resolver: true
